[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mus-downloader"
version = "0.1.0"
description = "Multi-source FLAC/MP3 Music Downloader"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "nonFeature"},
]
dependencies = [
    "pycryptodome>=3.18.0",
    "mutagen>=1.46.0",
    "httpx>=0.24.0",
    "yt-dlp>=2024.0.0",
    "ytmusicapi>=1.10.3",
    "aioslsk>=1.5.0",
    "aiogram>=3.17.0",
    "yt-dlp-ejs>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
bot = "bot.bot:run"
dl = "cli.main:main"

[tool.uv]
managed = true
package = true

[tool.hatch.build.targets.wheel]
packages = ["bot", "cli", "core"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
